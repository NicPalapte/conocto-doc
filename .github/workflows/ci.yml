name: CI

on:
  push:
    branches: [main]
  pull_request:

# Die CI liest nur den Code und schreibt nichts zurück – deshalb nur Leserechte.
# Ohne diesen Block liefe sie mit den Standardrechten des Repos.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Ganze Historie: die Prüfung unten vergleicht den PR mit main.
          fetch-depth: 0

      # Meldet, was nach dem Merge Konflikte erzeugt: Nummer von Hand, neue Tabellenzeile,
      # Version oder CHANGELOG.md von Hand. Siehe docs/decisions/neu-nummern-beim-merge.md.
      - name: Entscheidungen, Version, Changelog
        if: github.event_name == 'pull_request'
        run: |
          python3 -m unittest discover -s .github/conocto -q
          python3 .github/conocto/entscheidungen.py pruefen --praefix DOC \
            --versionsdatei frontend/package.json --lockdatei frontend/package-lock.json \
            --basis "origin/${{ github.base_ref }}"

      - name: Check for frontend app
        id: check
        run: echo "exists=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Format
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run format:check

      # Prüft src, vite.config.ts **und** tests/ (tsconfig.test.json). Ohne diesen
      # Schritt liefe nur der App-Code durch den Compiler — Typfehler in Tests
      # fielen erst auf, wenn ein Test aus einem anderen Grund rot wird.
      - name: Typecheck
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm test

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build
